# Pipeline CI/CD (DataOps): valida codigo Python + infraestructura Terraform
# en cada push/PR, y despliega (terraform apply) solo desde la rama main.
name: CI-CD DataOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: Pruebas Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q scripts conexion.py
      - run: python -m pytest tests -v

  terraform-plan:
    name: Terraform fmt / validate / plan
    runs-on: ubuntu-latest
    needs: test-python
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_atlas_public_key: ${{ secrets.ATLAS_PUBLIC_KEY }}
      TF_VAR_atlas_private_key: ${{ secrets.ATLAS_PRIVATE_KEY }}
      TF_VAR_project_id: ${{ secrets.ATLAS_PROJECT_ID }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -no-color

  deploy:
    name: Terraform apply (solo main)
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production   # permite exigir aprobacion manual en GitHub
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_atlas_public_key: ${{ secrets.ATLAS_PUBLIC_KEY }}
      TF_VAR_atlas_private_key: ${{ secrets.ATLAS_PRIVATE_KEY }}
      TF_VAR_project_id: ${{ secrets.ATLAS_PROJECT_ID }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform apply -auto-approve -input=false
